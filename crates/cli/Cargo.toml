[package]
name = "wiivci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI to inject Wii games into Wii U Virtual Console (WUP) packages"

[[bin]]
name = "wiivci"
path = "src/main.rs"

[dependencies]
wiivci-core = { path = "../core" }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
tempfile = "3.27.0"
