name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: wiivci-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wiivci-${{ github.ref_name }}-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          # nod pulls in C compression backends; steer the cc crate at the musl compiler.
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p wiivci

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar czf "${{ matrix.archive }}" \
            -C "target/${{ matrix.target }}/release" wiivci \
            -C "${{ github.workspace }}" README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path `
            "target/${{ matrix.target }}/release/wiivci.exe", `
            "README.md", "LICENSE" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wiivci-*-x86_64-linux.tar.gz
            wiivci-*-x86_64-windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
